<!doctype html><html><head><meta charset="utf-8"><title>Live Wire layout QA</title><style>body{margin:0;background:#282830;color:white;font:14px system-ui}nav{position:sticky;top:0;padding:8px;background:#17171e;z-index:5;display:flex;gap:10px;align-items:center}button,select{font:inherit;padding:6px}iframe{border:0;display:block}#report{font:12px monospace;white-space:pre-wrap;margin:8px}main{display:flex;align-items:start;gap:12px}</style></head><body><nav><label>Viewport <select id="size"><option>1194x834</option><option>320x568</option><option>375x812</option><option>390x844</option><option>430x932</option><option>844x390</option><option>390x480</option></select></label><label><input id="optional" type="checkbox">Hide optional controls</label><label><input id="safe" type="checkbox">34px bottom safe area</label><button id="measure">Measure layout</button></nav><main><iframe id="gameFrame" title="Live Wire test game" src="/"></iframe><pre id="report"></pre></main><script>
const frame=document.querySelector('iframe'),size=document.querySelector('#size');
function dimensions(){const [w,h]=size.value.split('x').map(Number);frame.width=w;frame.height=h;}
dimensions();size.onchange=dimensions;
document.querySelector('#optional').onchange=e=>{frame.contentDocument.querySelector('.secondary-controls').hidden=e.target.checked};
document.querySelector('#safe').onchange=e=>{frame.contentDocument.documentElement.style.setProperty('--screen-bottom',e.target.checked?'34px':'0px')};
document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,rect=s=>{const r=d.querySelector(s).getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};const root=d.documentElement,play=rect('#spin'),game=rect('main');const targets=['.game-header','.title','.pays','.machine-viewport','.result-zone','.control-area','footer','#betToggle','#spin','#turbo','#auto'];document.querySelector('#report').textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],document:[root.scrollWidth,root.scrollHeight],scroll:[w.scrollX,w.scrollY],playCenterError:play.x+play.w/2-(game.x+game.w/2),ready:d.body.classList.contains('ready'),font:w.getComputedStyle(d.querySelector('main')).fontFamily,layout:Object.fromEntries(targets.map(s=>[s,rect(s)])),popup:d.querySelector('#betPanel').open?{rect:rect('#betPanel'),scrollTop:d.querySelector('#betOptions').scrollTop,scrollHeight:d.querySelector('#betOptions').scrollHeight,clientHeight:d.querySelector('#betOptions').clientHeight}:null},null,2)};
</script></body></html>
